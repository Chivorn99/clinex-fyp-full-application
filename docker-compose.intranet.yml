services:
  mysql:
    ports: []

  backend:
    ports: []
    environment:
      APP_URL: ${APP_URL:-http://localhost}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}

  frontend:
    ports: []
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    command: >
      sh -lc "npm install
      && npm run build
      && npm run start -- --hostname 0.0.0.0 --port 3000"

  nginx:
    image: nginx:1.27-alpine
    container_name: clinex-nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ops/nginx/intranet.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ops/nginx/certs:/etc/nginx/certs:ro

# docker-compose.cloud-web.yml — Droplet 1: Web + Database
# Usage: docker compose -f docker-compose.cloud-web.yml up -d --build
# Runs on: clinex-web (2 vCPU / 4 GB RAM)

services:
  mysql:
    image: mysql:8.4
    container_name: clinex-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-clinex}
      MYSQL_USER: ${MYSQL_USER:-clinex}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-clinex_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    ports:
      - "0.0.0.0:3306:3306"     # Exposed on VPC for Droplet 2 queue worker
    volumes:
      - mysql_data:/var/lib/mysql
      - /opt/clinex-mysql-conf/low-memory.cnf:/etc/mysql/conf.d/low-memory.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root_password}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:alpine
    container_name: clinex-redis
    restart: unless-stopped
    command: redis-server --requirepass "${REDIS_PASSWORD:-changeme}"
    ports:
      - "0.0.0.0:6379:6379"     # Exposed on VPC for Droplet 2 queue worker
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PADDLE_VARIANT: cpu
    container_name: clinex-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    env_file:
      - ./backend/.env
    environment:
      APP_URL: http://clinex.live
      FRONTEND_URL: http://clinex.live
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-clinex}
      DB_USERNAME: ${MYSQL_USER:-clinex}
      DB_PASSWORD: ${MYSQL_PASSWORD:-clinex_password}
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-changeme}
    command: >
      sh -lc "composer install --no-interaction --prefer-dist --no-progress
      && php artisan key:generate --force
      && php artisan serve --host=0.0.0.0 --port=8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: clinex-frontend
    restart: unless-stopped
    depends_on:
      - backend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      NEXT_PUBLIC_API_URL: http://clinex.live/api
    command: >
      sh -lc "npm install
      && npm run build
      && npm run start -- --hostname 0.0.0.0 --port 3000"

  nginx:
    image: nginx:1.27-alpine
    container_name: clinex-nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ops/nginx/cloud.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ops/nginx/certs:/etc/nginx/certs:ro

volumes:
  mysql_data:
  backend_vendor:
  frontend_node_modules:

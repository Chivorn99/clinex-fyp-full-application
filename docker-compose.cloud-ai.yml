# docker-compose.cloud-ai.yml — Droplet 2: AI Engine + Queue Worker
# Usage: docker compose -f docker-compose.cloud-ai.yml up -d --build
# Runs on: clinex-ai (4 vCPU / 8 GB RAM)
#
# The queue worker connects to MySQL and Redis on Droplet 1 via VPC private IP.
# Set DB_HOST and REDIS_HOST in backend/.env to Droplet 1's private IP (e.g. 10.104.0.2).

services:
  ollama:
    image: ollama/ollama:latest
    container_name: clinex-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_HOST: "0.0.0.0"
      OLLAMA_KEEP_ALIVE: "5m"            # Unload model from RAM after 5 min idle
      OLLAMA_NUM_PARALLEL: "1"           # Only 1 concurrent request (save RAM)
      OLLAMA_MAX_LOADED_MODELS: "1"      # Only 1 model in RAM at a time
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  queue:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PADDLE_VARIANT: cpu
    container_name: clinex-queue
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - queue_vendor:/var/www/html/vendor
    env_file:
      - ./backend/.env
    environment:
      OLLAMA_HOST: ollama
      OLLAMA_PORT: 11434
    command: >
      sh -lc "composer install --no-interaction --prefer-dist --no-progress
      && php artisan horizon"

volumes:
  ollama_data:
  queue_vendor:
